name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  GO_VERSION: '1.23'

jobs:
  build:
    name: Build (${{ matrix.os }} ${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            binary_name: cr-coder
            artifact_name: cr-coder-linux-amd64
          - os: ubuntu-latest
            target: linux-arm64
            goos: linux
            goarch: arm64
            binary_name: cr-coder
            artifact_name: cr-coder-linux-arm64
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            binary_name: cr-coder.exe
            artifact_name: cr-coder-windows-amd64
          - os: macos-latest
            target: darwin-amd64
            goos: darwin
            goarch: amd64
            binary_name: cr-coder
            artifact_name: cr-coder-darwin-amd64
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            binary_name: cr-coder
            artifact_name: cr-coder-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify build
        shell: bash
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          VERSION=${GITHUB_SHA::8}
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w \
              -X main.version=${VERSION} \
              -X main.commit=${GITHUB_SHA} \
              -X main.date=${DATE}" \
            -o ${{ matrix.binary_name }} ./cmd/cr-coder
          echo "Build OK: ${{ matrix.binary_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.binary_name }}
          retention-days: 7